<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tsunamis</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; background: #000; cursor: none;
    font-family: 'Arial', sans-serif; }
  canvas { display: block; position: fixed; top: 0; left: 0; z-index: 10; }
  .slide { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1;
    display: none; align-items: center; justify-content: center;
    background: linear-gradient(170deg, #0a1530 0%, #142040 35%, #1a2a55 65%, #0e1a38 100%); }
  .slide.active { display: flex; }
  .slide-content { text-align: center; color: #c0d8f0; max-width: 75%; padding: 3rem; }
  .slide-content h2 { font-size: clamp(2rem, 5vw, 4rem); color: #e0f0ff; margin-bottom: 1.5rem;
    font-weight: 800; letter-spacing: 0.05em; }
  .slide-content p { font-size: clamp(1rem, 2.5vw, 1.5rem); line-height: 1.8; color: #a0c0e0; }
</style>
</head>
<body>
<div class="slide" id="slide-1">
  <div class="slide-content">
    <h2>Info Here</h2>
    <p>Slide content will go here.</p>
  </div>
</div>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H;
function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
window.addEventListener('resize', resize);
resize();

// --- Utilities ---
function lerp(a, b, t) { return a + (b - a) * t; }
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function smoothstep(a, b, t) { const x = clamp((t - a) / (b - a), 0, 1); return x * x * (3 - 2 * x); }
function rand(lo, hi) { return lo + Math.random() * (hi - lo); }
function easeIn(t) { return t * t * t; }
function easeOut(t) { return 1 - Math.pow(1 - t, 3); }
function easeInOut(t) { return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2; }

// --- Stars ---
const stars = [];
for (let i = 0; i < 120; i++) {
  stars.push({ x: Math.random(), y: Math.random() * 0.45, r: 0.4 + Math.random() * 1.2,
    phase: Math.random() * Math.PI * 2, speed: 0.5 + Math.random() * 2 });
}

// --- Particles ---
const particles = [];
const MAX_P = 7000;
function emit(x, y, vx, vy, size, life, type) {
  if (particles.length >= MAX_P) return;
  particles.push({ x, y, vx, vy, size, life, max: life, type });
}
function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    const g = p.type === 'mist' ? -80 : p.type === 'foam' ? 250 : 750;
    p.vy += g * dt;
    if (p.type === 'mist') { p.vx *= 0.96; p.vy *= 0.96; }
    if (p.type === 'spray') { p.vx *= 0.997; }
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.life -= dt;
    if (p.life <= 0 || p.y > H + 30 || p.x < -50) particles.splice(i, 1);
  }
}
function drawParticles() {
  for (const p of particles) {
    const a = clamp(p.life / p.max, 0, 1);
    const sz = p.size * (0.3 + 0.7 * a);
    switch (p.type) {
      case 'spray': ctx.fillStyle = `rgba(210,235,255,${a*0.85})`; break;
      case 'foam':  ctx.fillStyle = `rgba(255,255,255,${a*0.5})`; break;
      case 'mist':  ctx.fillStyle = `rgba(170,210,245,${a*0.13})`; break;
      case 'drop':  ctx.fillStyle = `rgba(140,200,255,${a*0.6})`; break;
      case 'crash': ctx.fillStyle = `rgba(235,248,255,${a*0.75})`; break;
    }
    ctx.beginPath();
    ctx.arc(p.x, p.y, sz, 0, Math.PI * 2);
    ctx.fill();
  }
}

// --- Wave & presentation state ---
let waveActive = true;
let wavePhase = 0;
const WAVE_DURATION = 11;
let time = 0, prevTS = 0;
let usedOnce = false;

let stage = 'wave';
let transitionProgress = 0;
const TRANSITION_DUR = 4.5;

window.addEventListener('keydown', (e) => {
  if (e.key === 't' || e.key === 'T') {
    waveActive = true;
    wavePhase = 0;
    stage = 'wave';
    transitionProgress = 0;
    canvas.style.display = 'block';
    document.getElementById('slide-1').classList.remove('active');
    particles.length = 0;
    resetWetGrid();
    if (!usedOnce) { usedOnce = true; }
  }
});

// --- Text-water collision system ---
let textImageData = null;
let textDataW = 0, textDataH = 0;
const GRID_STEP = 4;
let wetGrid = null;
let wetGridCols = 0, wetGridRows = 0;
let textBounds = { left: 0, right: 0, top: 0, bottom: 0 };
let prevSurfaceY_buf = null;

function buildTextBitmap() {
  const off = document.createElement('canvas');
  off.width = textDataW = W;
  off.height = textDataH = H;
  const octx = off.getContext('2d');
  const fontSize = Math.min(W / 5.5, H / 4.5, 200);
  octx.font = `900 ${fontSize}px "Arial Black", "Impact", Arial, sans-serif`;
  octx.textAlign = 'center';
  octx.textBaseline = 'middle';
  octx.fillStyle = '#fff';
  octx.fillText('TSUNAMIS', W / 2, H * 0.42);
  textImageData = octx.getImageData(0, 0, W, H).data;

  let minX = W, maxX = 0, minY = H, maxY = 0;
  for (let y = 0; y < H; y += 2) {
    for (let x = 0; x < W; x += 2) {
      if (textImageData[(y * W + x) * 4 + 3] > 128) {
        if (x < minX) minX = x; if (x > maxX) maxX = x;
        if (y < minY) minY = y; if (y > maxY) maxY = y;
      }
    }
  }
  textBounds = { left: Math.max(minX - 6, 0), right: Math.min(maxX + 6, W),
                 top: Math.max(minY - 6, 0), bottom: Math.min(maxY + 6, H) };
  wetGridCols = Math.ceil((textBounds.right - textBounds.left) / GRID_STEP);
  wetGridRows = Math.ceil((textBounds.bottom - textBounds.top) / GRID_STEP);
  wetGrid = new Uint8Array(wetGridCols * wetGridRows);
  prevSurfaceY_buf = new Float64Array(SURF_N);
  prevSurfaceY_buf.fill(H);
}

function isTextPixel(px, py) {
  const ix = Math.round(px), iy = Math.round(py);
  if (ix < 0 || ix >= textDataW || iy < 0 || iy >= textDataH) return false;
  return textImageData[(iy * textDataW + ix) * 4 + 3] > 128;
}

function resetWetGrid() {
  if (wetGrid) wetGrid.fill(0);
  if (prevSurfaceY_buf) prevSurfaceY_buf.fill(H);
}

function checkTextSplashes(dt) {
  if (!textImageData || !wetGrid || stage === 'slide') return;
  if (stage === 'wave' && wavePhase < 0.06) return;

  for (let row = 0; row < wetGridRows; row++) {
    for (let col = 0; col < wetGridCols; col++) {
      const px = textBounds.left + col * GRID_STEP;
      const py = textBounds.top + row * GRID_STEP;
      if (!isTextPixel(px, py)) continue;

      const above = isTextPixel(px, py - GRID_STEP);
      const below = isTextPixel(px, py + GRID_STEP);
      const left  = isTextPixel(px - GRID_STEP, py);
      const right = isTextPixel(px + GRID_STEP, py);
      if (above && below && left && right) continue;

      const si = clamp(Math.floor((px / W) * (SURF_N - 1)), 0, SURF_N - 1);
      const waterY = surfaceY[si];
      const prevWY = prevSurfaceY_buf[si];

      const submerged = waterY <= py;
      const gi = row * wetGridCols + col;
      const wasSubmerged = wetGrid[gi];

      if (submerged && !wasSubmerged) {
        const risingSpeed = Math.max(0, -(waterY - prevWY) / Math.max(dt, 0.001));
        const si_l = clamp(si - 4, 0, SURF_N - 1);
        const si_r = clamp(si + 4, 0, SURF_N - 1);
        const slope = (surfaceY[si_r] - surfaceY[si_l]) / (8 * (W / SURF_N));
        const hFlow = -slope * 500;
        const impact = Math.sqrt(hFlow * hFlow + risingSpeed * risingSpeed);

        let baseAngle = -Math.PI / 2;
        if      (!above && below)          baseAngle = -Math.PI / 2;
        else if (above && !below)          baseAngle =  Math.PI / 2;
        else if (!left && right)           baseAngle =  Math.PI;
        else if (left && !right)           baseAngle =  0;
        else if (!above && !left)          baseAngle = -Math.PI * 0.75;
        else if (!above && !right)         baseAngle = -Math.PI * 0.25;
        else if (!below && !left)          baseAngle =  Math.PI * 0.75;
        else if (!below && !right)         baseAngle =  Math.PI * 0.25;

        const nP = clamp(Math.floor(impact / 80), 1, 5);
        for (let i = 0; i < nP; i++) {
          const a = baseAngle + rand(-0.8, 0.8);
          const spd = clamp(impact * rand(0.12, 0.55), 50, 600);
          emit(px + rand(-3, 3), py + rand(-3, 3),
            Math.cos(a) * spd + hFlow * 0.25,
            Math.sin(a) * spd,
            rand(1, 4.5), rand(0.2, 1.4), 'spray');
        }
        if (impact > 120 && Math.random() < 0.35) {
          emit(px + rand(-5, 5), py + rand(-5, 5),
            rand(-30, 30), rand(-60, -10),
            rand(5, 12), rand(0.3, 0.9), 'foam');
        }
      }

      if (!submerged && wasSubmerged && wavePhase > 0.60) {
        if (Math.random() < 0.06) {
          emit(px + rand(-2, 2), py + rand(0, 4),
            rand(-8, 8), rand(40, 140),
            rand(1, 2.5), rand(0.3, 1.0), 'drop');
        }
      }

      wetGrid[gi] = submerged ? 1 : 0;
    }
  }
}

// --- Wave parameters ---
// The tsunami is a wall of water rising from the horizon TOWARD the viewer.
// wallCrestY = screen Y of the wave crest (drops as wave approaches)
// floodH     = how high the front water rises (submerges the text)
// curlP      = curl/overhang progress
function getWaveParams(p) {
  const horizonY = H * 0.54;
  let wallCrestY, floodH, curlP, drawback;

  if (p < 0.08) {
    // Drawback
    const t = p / 0.08;
    drawback = easeInOut(t) * H * 0.05;
    wallCrestY = horizonY + 20;
    floodH = 0; curlP = 0;
  } else if (p < 0.44) {
    // Approach: wall rises from horizon toward the viewer
    const t = (p - 0.08) / 0.36;
    drawback = (1 - easeIn(t)) * H * 0.05;
    wallCrestY = lerp(horizonY, H * 0.04, easeOut(t));
    floodH = lerp(0, H * 0.04, easeIn(t));
    curlP = smoothstep(0.55, 1.0, t);
  } else if (p < 0.54) {
    // Crash: wall crests, water floods forward over the text
    const t = (p - 0.44) / 0.10;
    drawback = 0;
    wallCrestY = lerp(H * 0.04, -H * 0.15, easeIn(t));
    floodH = lerp(H * 0.04, H * 0.30, easeOut(t));
    curlP = 1;
  } else if (p < 0.68) {
    // Flood: everything submerged
    const t = (p - 0.54) / 0.14;
    drawback = 0;
    wallCrestY = -H * 0.2;
    floodH = lerp(H * 0.30, H * 0.35, easeOut(t * 0.5));
    curlP = (1 - t) * 0.4;
  } else {
    // Sustained flood for transition
    drawback = 0;
    wallCrestY = -H * 0.2;
    floodH = H * 0.35;
    curlP = 0;
  }

  return { wallCrestY, floodH, curlP, drawback };
}

// --- Crest wave helper (wavy edge for the wall top) ---
function getCrestWave(x, t) {
  return Math.sin(x * 0.008 + t * 2.5) * 10
       + Math.sin(x * 0.018 - t * 3.2) * 6
       + Math.sin(x * 0.004 + t * 1.5) * 15;
}

// --- Water surface (front ocean — ambient waves + flood) ---
const SURF_N = 400;
const surfaceY = new Float64Array(SURF_N);

function computeSurface(t, params) {
  const baseY = H * 0.68 + (params.drawback || 0);
  for (let i = 0; i < SURF_N; i++) {
    const x = (i / (SURF_N - 1)) * W;
    let ambient = 0;
    ambient += Math.sin(x * 0.007 + t * 1.3) * 7;
    ambient += Math.sin(x * 0.013 - t * 0.9) * 5;
    ambient += Math.sin(x * 0.003 + t * 0.6) * 10;
    ambient += Math.sin(x * 0.022 + t * 2.1) * 3;
    surfaceY[i] = baseY - ambient - (params.floodH || 0);
  }
}

// ====================== RENDERING ======================

function drawSky() {
  const grad = ctx.createLinearGradient(0, 0, 0, H * 0.72);
  grad.addColorStop(0, '#050a1a');
  grad.addColorStop(0.15, '#0a1230');
  grad.addColorStop(0.4, '#142050');
  grad.addColorStop(0.7, '#1e3568');
  grad.addColorStop(1.0, '#2a4a78');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
}

function drawStars(t) {
  for (const s of stars) {
    const flicker = 0.4 + 0.6 * (0.5 + 0.5 * Math.sin(t * s.speed + s.phase));
    ctx.globalAlpha = flicker * 0.8;
    ctx.fillStyle = '#e0e8ff';
    ctx.beginPath();
    ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawMoon(t) {
  const mx = W * 0.12, my = H * 0.1, mr = Math.min(W, H) * 0.028;
  const glow = ctx.createRadialGradient(mx, my, 0, mx, my, mr * 6);
  glow.addColorStop(0, 'rgba(180,210,255,0.25)');
  glow.addColorStop(0.5, 'rgba(180,210,255,0.06)');
  glow.addColorStop(1, 'rgba(180,210,255,0)');
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(mx, my, mr * 6, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#dde8ff';
  ctx.beginPath(); ctx.arc(mx, my, mr, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(180,195,220,0.5)';
  ctx.beginPath(); ctx.arc(mx - mr*0.25, my - mr*0.15, mr*0.15, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(mx + mr*0.3, my + mr*0.2, mr*0.12, 0, Math.PI * 2); ctx.fill();

  const baseY = H * 0.68;
  for (let i = 0; i < 18; i++) {
    const y = baseY + 5 + i * H * 0.014;
    const shimmer = Math.sin(t * 3 + i * 0.7) * W * 0.007;
    ctx.fillStyle = `rgba(180,210,255,${0.10 * (1 - i/18)})`;
    ctx.fillRect(mx - 7 + shimmer, y, 14, H * 0.010);
  }
}

// --- The tsunami wall (rendered BEHIND the text) ---
function drawWaveWall(t, params) {
  const crestY = params.wallCrestY;
  const baseY = H * 0.68;
  if (crestY >= baseY) return;

  ctx.save();

  // Wall body — full width, from crest to bottom
  const wallGrad = ctx.createLinearGradient(0, crestY - 30, 0, H);
  wallGrad.addColorStop(0, '#1a6a9a');
  wallGrad.addColorStop(0.02, '#15608a');
  wallGrad.addColorStop(0.08, '#0d4a72');
  wallGrad.addColorStop(0.2, '#083555');
  wallGrad.addColorStop(0.45, '#052840');
  wallGrad.addColorStop(1, '#031520');
  ctx.fillStyle = wallGrad;

  ctx.beginPath();
  ctx.moveTo(-10, H);
  ctx.lineTo(-10, crestY + getCrestWave(-10, t));
  for (let x = -10; x <= W + 10; x += 3) {
    ctx.lineTo(x, crestY + getCrestWave(x, t));
  }
  ctx.lineTo(W + 10, H);
  ctx.closePath();
  ctx.fill();

  // Horizontal flow lines on the wall face (texture)
  const wallHeight = baseY - crestY;
  if (wallHeight > 30) {
    ctx.globalAlpha = clamp(wallHeight / H, 0, 0.5);
    for (let dy = 20; dy < wallHeight && dy < H; dy += 25) {
      const y = crestY + dy;
      const a = 0.04 + 0.03 * Math.sin(dy * 0.08 + t * 1.5);
      ctx.strokeStyle = `rgba(80,160,220,${a})`;
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (let x = 0; x < W; x += 5) {
        const wobble = Math.sin(x * 0.015 + dy * 0.04 + t * 2) * 4;
        if (x === 0) ctx.moveTo(x, y + wobble);
        else ctx.lineTo(x, y + wobble);
      }
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  // Bright crest foam line
  const foamAlpha = clamp(wallHeight / (H * 0.15), 0, 1);
  ctx.strokeStyle = `rgba(220,240,255,${foamAlpha * 0.8})`;
  ctx.lineWidth = 4 + foamAlpha * 3;
  ctx.lineCap = 'round';
  ctx.beginPath();
  for (let x = -10; x <= W + 10; x += 3) {
    const y = crestY + getCrestWave(x, t);
    if (x === -10) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();

  // Secondary foam line
  ctx.strokeStyle = `rgba(200,230,255,${foamAlpha * 0.35})`;
  ctx.lineWidth = 2;
  ctx.beginPath();
  for (let x = -10; x <= W + 10; x += 3) {
    const y = crestY + getCrestWave(x, t) + 6;
    if (x === -10) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();

  // Foam dots scattered along the crest
  if (foamAlpha > 0.1) {
    for (let x = 0; x < W; x += 10) {
      if (Math.random() < 0.4) {
        const y = crestY + getCrestWave(x, t);
        ctx.fillStyle = `rgba(255,255,255,${rand(0.15, 0.45) * foamAlpha})`;
        ctx.beginPath();
        ctx.arc(x + rand(-6, 6), y + rand(-10, 12), rand(2, 5), 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  // Curl overhang (water curling forward TOWARD viewer = downward from crest)
  if (params.curlP > 0.1) {
    const cp = params.curlP;
    const overhang = H * 0.12 * cp;

    // Dark overhang shadow
    const ohGrad = ctx.createLinearGradient(0, crestY, 0, crestY + overhang);
    ohGrad.addColorStop(0, `rgba(8,40,65,${cp * 0.7})`);
    ohGrad.addColorStop(0.5, `rgba(5,25,45,${cp * 0.5})`);
    ohGrad.addColorStop(1, `rgba(3,15,30,0)`);

    ctx.fillStyle = ohGrad;
    ctx.beginPath();
    for (let x = -10; x <= W + 10; x += 3) {
      const cw = getCrestWave(x, t);
      const tipWave = Math.sin(x * 0.01 + t * 3.5) * 6 + Math.sin(x * 0.006 - t * 2) * 10;
      if (x === -10) ctx.moveTo(x, crestY + cw);
      else ctx.lineTo(x, crestY + cw);
    }
    for (let x = W + 10; x >= -10; x -= 3) {
      const tipWave = Math.sin(x * 0.01 + t * 3.5) * 6 + Math.sin(x * 0.006 - t * 2) * 10;
      ctx.lineTo(x, crestY + overhang + tipWave);
    }
    ctx.closePath();
    ctx.fill();

    // Foam drip line at overhang lip
    ctx.strokeStyle = `rgba(255,255,255,${cp * 0.55})`;
    ctx.lineWidth = 2.5 + cp * 2;
    ctx.beginPath();
    for (let x = -10; x <= W + 10; x += 3) {
      const tipWave = Math.sin(x * 0.01 + t * 3.5) * 6 + Math.sin(x * 0.006 - t * 2) * 10;
      if (x === -10) ctx.moveTo(x, crestY + overhang + tipWave);
      else ctx.lineTo(x, crestY + overhang + tipWave);
    }
    ctx.stroke();
  }

  // Darken the sky above the wall (shadow cast by the towering wave)
  if (crestY < H * 0.45) {
    const darkness = clamp((H * 0.45 - crestY) / (H * 0.5), 0, 0.45);
    ctx.fillStyle = `rgba(0,0,0,${darkness})`;
    ctx.fillRect(0, 0, W, crestY + 10);
  }

  ctx.restore();
}

function drawText(t, params) {
  const fontSize = Math.min(W / 5.5, H / 4.5, 200);
  let tx = W / 2, ty = H * 0.42;

  // Tremor as the wall looms behind
  if (waveActive && params.wallCrestY < H * 0.55) {
    const proximity = 1 - clamp((params.wallCrestY - H * 0.05) / (H * 0.45), 0, 1);
    const intensity = proximity * 5;
    tx += Math.sin(t * 37) * intensity;
    ty += Math.cos(t * 29) * intensity * 0.6;
  }

  // Dim text when submerged by front water
  let textAlpha = 1;
  const waterAtText = surfaceY[Math.floor(((W/2) / W) * (SURF_N - 1))] || H * 0.68;
  if (waterAtText < ty + fontSize * 0.4) {
    textAlpha = clamp((waterAtText - (ty - fontSize * 0.5)) / fontSize, 0, 1);
    textAlpha = Math.max(textAlpha * 0.15, 0);
  }

  ctx.save();
  ctx.globalAlpha = clamp(textAlpha, 0, 1);
  ctx.font = `900 ${fontSize}px "Arial Black", "Impact", Arial, sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  ctx.shadowColor = 'rgba(80,160,255,0.6)';
  ctx.shadowBlur = 35;
  ctx.strokeStyle = 'rgba(80,160,255,0.3)';
  ctx.lineWidth = 3;
  ctx.strokeText('TSUNAMIS', tx, ty);

  const tg = ctx.createLinearGradient(tx - fontSize * 2.5, ty, tx + fontSize * 2.5, ty);
  tg.addColorStop(0, '#ffffff');
  tg.addColorStop(0.3, '#b8d8ff');
  tg.addColorStop(0.5, '#ffffff');
  tg.addColorStop(0.7, '#b8d8ff');
  tg.addColorStop(1, '#ffffff');
  ctx.fillStyle = tg;
  ctx.fillText('TSUNAMIS', tx, ty);

  ctx.shadowBlur = 0;
  ctx.globalAlpha = 1;
  ctx.restore();
}

function drawOcean(t) {
  const deep = ctx.createLinearGradient(0, H * 0.4, 0, H);
  deep.addColorStop(0, '#08203a');
  deep.addColorStop(0.4, '#051828');
  deep.addColorStop(1, '#020c15');
  ctx.fillStyle = deep;
  ctx.beginPath();
  ctx.moveTo(0, H);
  for (let i = 0; i < SURF_N; i++) ctx.lineTo((i / (SURF_N - 1)) * W, surfaceY[i] + 10);
  ctx.lineTo(W, H);
  ctx.closePath();
  ctx.fill();

  const minSurf = Math.min(...surfaceY);
  const main = ctx.createLinearGradient(0, Math.max(minSurf - 20, 0), 0, H);
  main.addColorStop(0, '#1a70a8');
  main.addColorStop(0.06, '#156090');
  main.addColorStop(0.15, '#0d4a72');
  main.addColorStop(0.35, '#083558');
  main.addColorStop(0.6, '#052540');
  main.addColorStop(1, '#031520');
  ctx.fillStyle = main;
  ctx.beginPath();
  ctx.moveTo(0, H);
  for (let i = 0; i < SURF_N; i++) ctx.lineTo((i / (SURF_N - 1)) * W, surfaceY[i]);
  ctx.lineTo(W, H);
  ctx.closePath();
  ctx.fill();

  ctx.strokeStyle = 'rgba(140,200,255,0.28)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  for (let i = 0; i < SURF_N; i++) {
    const x = (i / (SURF_N - 1)) * W;
    if (i === 0) ctx.moveTo(x, surfaceY[i]); else ctx.lineTo(x, surfaceY[i]);
  }
  ctx.stroke();

  ctx.strokeStyle = 'rgba(255,255,255,0.10)';
  ctx.lineWidth = 2;
  ctx.setLineDash([6, 14]);
  ctx.beginPath();
  for (let i = 0; i < SURF_N; i++) {
    const x = (i / (SURF_N - 1)) * W;
    if (i === 0) ctx.moveTo(x, surfaceY[i] - 1); else ctx.lineTo(x, surfaceY[i] - 1);
  }
  ctx.stroke();
  ctx.setLineDash([]);
}

function drawFoamBand() {
  ctx.save();
  for (let i = 3; i < SURF_N - 3; i++) {
    const slope = Math.abs(surfaceY[i + 3] - surfaceY[i - 3]) / 6;
    if (slope > 1.5) {
      const x = (i / (SURF_N - 1)) * W;
      const y = surfaceY[i];
      const d = clamp((slope - 1.5) / 5, 0, 1);
      for (let j = 0; j < Math.floor(d * 4); j++) {
        ctx.fillStyle = `rgba(255,255,255,${0.12 + d * 0.35})`;
        ctx.beginPath();
        ctx.arc(x + rand(-10, 10), y + rand(-3, 14), rand(2, 5 + d * 5), 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }
  ctx.restore();
}

function drawTransitionFoam(t, edgeY) {
  ctx.save();
  const bandH = 50;

  ctx.beginPath();
  ctx.moveTo(-10, edgeY + 20);
  for (let x = -10; x <= W + 10; x += 3) {
    const wave = Math.sin(x * 0.012 + t * 3.5) * 13
               + Math.sin(x * 0.007 - t * 2.2) * 17
               + Math.sin(x * 0.028 + t * 5) * 6;
    ctx.lineTo(x, edgeY - bandH + wave);
  }
  ctx.lineTo(W + 10, edgeY + 20);
  ctx.closePath();

  const fg = ctx.createLinearGradient(0, edgeY - bandH - 15, 0, edgeY + 20);
  fg.addColorStop(0, 'rgba(255,255,255,0)');
  fg.addColorStop(0.2, 'rgba(220,240,255,0.4)');
  fg.addColorStop(0.45, 'rgba(255,255,255,0.85)');
  fg.addColorStop(0.7, 'rgba(200,230,255,0.45)');
  fg.addColorStop(1, 'rgba(180,215,240,0.1)');
  ctx.fillStyle = fg;
  ctx.fill();

  for (let i = 0; i < 50; i++) {
    ctx.fillStyle = `rgba(255,255,255,${rand(0.15, 0.5)})`;
    ctx.beginPath();
    ctx.arc(rand(0, W), edgeY + rand(-32, 12), rand(1.5, 5), 0, Math.PI * 2);
    ctx.fill();
  }

  for (let i = 0; i < 3; i++) {
    emit(rand(0, W), edgeY + rand(-14, 5),
      rand(-35, 35), rand(-70, -15),
      rand(1.5, 4), rand(0.3, 1.2), 'spray');
  }

  ctx.restore();
}

// --- Particle spawning from the wave wall ---
function spawnWallParticles(params, dt) {
  if (!waveActive && stage !== 'flooded') return;
  const rate = dt / 0.016;
  const crestY = params.wallCrestY;
  const baseY = H * 0.68;
  const wallHeight = baseY - crestY;
  if (wallHeight < 20) return;

  // Spray upward from the crest (full width)
  if (crestY < baseY - 30 && wavePhase < 0.68) {
    const n = Math.floor(clamp(wallHeight / H * 18, 0, 14) * rate);
    for (let i = 0; i < n; i++) {
      const x = rand(0, W);
      emit(x, crestY + getCrestWave(x, time) + rand(-8, 8),
        rand(-80, 80), rand(-350, -100),
        rand(1.5, 5), rand(0.3, 2), 'spray');
    }
  }

  // Mist at the crest
  if (crestY < baseY - 50 && wavePhase < 0.70) {
    if (Math.random() < 0.5 * rate) {
      emit(rand(W * 0.1, W * 0.9), crestY + rand(-25, 25),
        rand(-50, 50), rand(-140, -30),
        rand(30, 65), rand(2, 5), 'mist');
    }
  }

  // Cascade: water spilling over the crest and falling toward viewer
  if (params.curlP > 0.2 && wavePhase < 0.65) {
    const n = Math.floor(params.curlP * 25 * rate);
    for (let i = 0; i < n; i++) {
      const x = rand(0, W);
      emit(x, crestY + getCrestWave(x, time) + rand(5, 30),
        rand(-25, 25), rand(80, 400),
        rand(1.5, 5), rand(0.4, 1.5), 'drop');
    }
  }

  // Crash burst (during the break phase)
  if (wavePhase > 0.42 && wavePhase < 0.58) {
    const intensity = 1 - Math.abs(wavePhase - 0.50) / 0.08;
    const n = Math.floor(intensity * 25 * rate);
    for (let i = 0; i < n; i++) {
      emit(rand(W * 0.05, W * 0.95), crestY + rand(10, H * 0.25),
        rand(-200, 200), rand(-500, -80),
        rand(2, 7), rand(0.3, 1.8), 'crash');
    }
    // Dense mist
    for (let i = 0; i < Math.floor(intensity * 6 * rate); i++) {
      emit(rand(0, W), rand(crestY, crestY + H * 0.2),
        rand(-100, 100), rand(-180, -30),
        rand(30, 70), rand(2, 5), 'mist');
    }
  }

  // Foam on turbulent front water during flood
  if (wavePhase > 0.52 && wavePhase < 0.80) {
    const n = Math.floor(5 * rate);
    for (let i = 0; i < n; i++) {
      const rx = rand(0, W);
      const ri = Math.floor((rx / W) * (SURF_N - 1));
      const ry = surfaceY[clamp(ri, 0, SURF_N - 1)];
      emit(rx, ry + rand(-5, 5), rand(-40, 40), rand(-80, -20),
        rand(3, 8), rand(0.5, 2), 'foam');
    }
  }
}

// ====================== MAIN LOOP ======================

function frame(ts) {
  if (!prevTS) prevTS = ts;
  const dt = Math.min((ts - prevTS) / 1000, 0.05);
  prevTS = ts;
  time += dt;

  if (stage === 'slide') { requestAnimationFrame(frame); return; }

  let params = { wallCrestY: H, floodH: 0, curlP: 0, drawback: 0 };
  let edgeY = -200; // off-screen until transition

  // --- Wave approach: wall rises from horizon ---
  if (stage === 'wave') {
    wavePhase += dt / WAVE_DURATION;
    if (wavePhase >= 0.44) {
      // Wall has crested — the crash IS the page transition
      stage = 'transition';
      transitionProgress = 0;
      waveActive = false;
      document.getElementById('slide-1').classList.add('active');
    } else {
      params = getWaveParams(wavePhase);
    }
  }

  // --- Crash + pull-down as one continuous motion ---
  if (stage === 'transition') {
    transitionProgress += dt / TRANSITION_DUR;
    if (transitionProgress >= 1) {
      stage = 'slide';
      canvas.style.display = 'none';
      requestAnimationFrame(frame);
      return;
    }
    // The wave crest sweeps from near the top down to below the screen
    edgeY = lerp(H * 0.04, H + 80, easeInOut(transitionProgress));
    // Front water surface tracks the foam edge
    params.wallCrestY = -H * 0.2;
    params.floodH = Math.max(0, H * 0.68 - edgeY);
    params.curlP = 0;
    params.drawback = 0;
  }

  // Text collision bitmap
  if (!textImageData || textDataW !== W || textDataH !== H) buildTextBitmap();

  // Compute front water surface
  computeSurface(time, params);

  // Text collision splashes (fire as the foam edge sweeps over the letters)
  checkTextSplashes(dt);
  if (prevSurfaceY_buf) prevSurfaceY_buf.set(surfaceY);

  // --- Draw ---
  ctx.clearRect(0, 0, W, H);
  drawSky();
  drawStars(time);
  drawMoon(time);
  drawWaveWall(time, params);
  drawText(time, params);
  drawOcean(time);
  drawFoamBand();

  // The wave crest sweeping down clears the scene above it, revealing the next slide
  if (stage === 'transition') {
    ctx.clearRect(0, 0, W, Math.max(0, edgeY - 45));
    drawTransitionFoam(time, edgeY);

    // Extra crash spray as foam sweeps through the text area
    if (edgeY > H * 0.25 && edgeY < H * 0.6) {
      const rate = dt / 0.016;
      for (let i = 0; i < Math.floor(6 * rate); i++) {
        emit(rand(W * 0.1, W * 0.9), edgeY + rand(-20, 10),
          rand(-120, 120), rand(-350, -80),
          rand(2, 6), rand(0.3, 1.5), 'crash');
      }
    }
  }

  // Particles (drawn last — spray flies above the foam into the cleared area)
  spawnWallParticles(params, dt);
  updateParticles(dt);
  drawParticles();

  requestAnimationFrame(frame);
}

requestAnimationFrame(frame);
</script>
